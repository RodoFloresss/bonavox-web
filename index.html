<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonavox AI | Estamos mejorando</title>
    <meta name="description" content="Bonavox AI está en mantenimiento. Volvemos pronto.">
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            background: #0A0F1E;
            color: #F4F7FF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 500px;
            height: 500px;
            transform: translate(-50%, -50%);
            background: rgba(0, 82, 255, 0.15);
            filter: blur(120px);
            border-radius: 50%;
            pointer-events: none;
        }
        main { position: relative; max-width: 560px; }
        img { height: 72px; width: auto; margin-bottom: 32px; }
        h1 {
            font-size: clamp(1.9rem, 6vw, 2.8rem);
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 16px;
        }
        h1 span {
            background: linear-gradient(90deg, #0052FF, #00F5E1);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        p { color: #94A3B8; font-size: 1.05rem; line-height: 1.6; margin-bottom: 28px; }
        a.mail {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 12px;
            background: linear-gradient(90deg, #0052FF, #00F5E1);
            color: #0A0F1E;
            font-weight: 800;
            text-decoration: none;
        }
        footer { position: relative; margin-top: 48px; font-size: 0.8rem; color: #64748B; }
        footer a { color: #64748B; text-decoration: none; margin: 0 10px; }
        footer a:hover { color: #94A3B8; }
    </style>
</head>
<body>
    <main>
        <img src="./logo-1.png" alt="Bonavox AI">
        <h1>Estamos <span>mejorando</span> Bonavox AI</h1>
        <p>El sitio está en construcción mientras renovamos nuestros servicios. Volvemos pronto. Si necesitas algo mientras tanto, escríbenos.</p>
        <a class="mail" href="mailto:info@bonavoxai.com">info@bonavoxai.com</a>
    </main>
    <footer>
        <a href="./privacidad.html">Privacidad</a>
        <a href="./terminos.html">Términos</a>
        <p style="margin:16px 0 0;font-size:0.8rem;color:#64748B;">&copy; 2026 Bonavox AI · Cancún &amp; Riviera Maya</p>
    </footer>
</body>
</html>
